<div class="verses" data-psalm='nunc-dimittis'><p><span class="verse-number">2.&nbsp;</span><i>Quia</i> vidérunt óculi <b>me</b>i&nbsp;<span class='red'>*</span> salu<i>tá</i><i>re</i> <b>tu</b>um,<br></p><p><span class="verse-number">3.&nbsp;</span>Quod pa<b>rá</b>sti&nbsp;<span class='red'>*</span> ante fáciem ómnium <i>po</i><i>pu</i><b>ló</b>rum,<br></p><p><span class="verse-number">4.&nbsp;</span><i>Lumen</i> ad revelatiónem <b>Gén</b>tium,&nbsp;<span class='red'>*</span> et glóriam plebis <i>tu</i><i>æ</i> <b>Is</b>raël.<br></p><p><span class="verse-number">5.&nbsp;</span><i>Glóri</i>a Pátri, et <b>Fí</b>lio,&nbsp;<span class='red'>*</span> et Spirí<i>tu</i><i>i</i> <b>Sán</b>cto.<br></p><p><span class="verse-number">6.&nbsp;</span><i>Sicut</i> érat in princípio, et núnc, et <b>sém</b>per,&nbsp;<span class='red'>*</span> et in sǽcula sæcu<i>ló</i><i>rum</i>. <b>A</b>men.<br></p></div>
